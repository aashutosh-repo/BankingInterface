<div class="container">
  <div class="payment-wrapper">
    <h2 class="title">Payment Gateway</h2>
    <div class="accepted-cards">
      <p>We accept:</p>
      <div class="card-logos">
        <img src="/cardlogo/visa.png" alt="VISA" />
        <img src="/cardlogo/mastercard.png" alt="Mastercard" />
        <img src="/cardlogo/amex.png" alt="American Express" />
      </div>
    </div>
    <form [formGroup]="paymentForm" (ngSubmit)="onSubmit()">
      <div>
        <label>Payment Method</label>
        <select formControlName="paymentMethod">
          <option value="card">Credit/Debit Card</option>
          <option value="upi">UPI</option>
        </select>
      </div>

      <div *ngIf="paymentForm.value.paymentMethod === 'card'">
        <label>Card Holder Name</label>
        <input type="text" formControlName="cardHolderName" placeholder="John Doe" />

        <label>Card Number</label>
        <div class="card-input-wrapper">
          <input type="text" 
                 formControlName="cardNumber" 
                 placeholder="1234 5678 9123 4567"
                 (input)="detectCardType(paymentForm.value.cardNumber)" />
          <img *ngIf="cardType" 
               [src]="'/cardlogo/' + cardType + '.png'" 
               [alt]="cardType" 
               class="card-icon" />
        </div>
        <div class="row">
          <input type="text" formControlName="expiry" placeholder="MM/YY" />
          <input type="text" formControlName="cvv" placeholder="CVV" />
        </div>
      </div>

      <div *ngIf="paymentForm.value.paymentMethod === 'upi'">
        <label>UPI ID</label>
        <input type="text" formControlName="upiId" placeholder="example@upi" />
      </div>

      <button type="submit">Pay Now</button>
    </form>
  </div>
</div>
