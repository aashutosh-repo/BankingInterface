<div [formGroup]="billingForm" class="billing-address-form">
  <div class="billing-head">Billing Address</div>
  <div class="form-container">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Payer Name</mat-label>
      <input matInput formControlName="payerName" placeholder="John Doe" />
      <mat-error *ngIf="billingForm.get('payerName')?.hasError('required')">
        Payer name is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Full Address</mat-label>
      <textarea matInput formControlName="fullAddress" placeholder="123 Main St"></textarea>
      <mat-error *ngIf="billingForm.get('fullAddress')?.hasError('required')">
        Address is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>City</mat-label>
      <input matInput formControlName="city" placeholder="New York" />
      <mat-error *ngIf="billingForm.get('city')?.hasError('required')">
        City is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Country</mat-label>
      <input matInput formControlName="country" placeholder="USA" />
      <mat-error *ngIf="billingForm.get('country')?.hasError('required')">
        Country is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Pincode</mat-label>
      <input matInput formControlName="pincode" placeholder="123456" />
      <mat-error *ngIf="billingForm.get('pincode')?.hasError('required')">
        Pincode is required
      </mat-error>
      <mat-error *ngIf="billingForm.get('pincode')?.hasError('pattern')">
        Pincode must be 6 digits
      </mat-error>
    </mat-form-field>
  </div>
</div>
