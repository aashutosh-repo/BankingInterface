
<div class="container">
  <mat-card class="payment-wrapper">
    <h2 mat-card-title>Payment Gateway</h2>
    <div class="accepted-cards">
      <p>We accept:</p>
      <div class="card-logos">
        <img src="/cardlogo/visa.png" alt="VISA" />
        <img src="/cardlogo/mastercard.png" alt="Mastercard" />
        <img src="/cardlogo/amex.png" alt="American Express" />
        <img src="/cardlogo/rupay.png" alt="rupay-card" />
      </div>
    </div>

    <form [formGroup]="paymentForm" (ngSubmit)="onSubmit()">

<div class="payment-container">
  <!-- LHS: Parent payment methods -->
  <mat-radio-group formControlName="paymentMethod" class="parent-options">
    <mat-radio-button
      *ngFor="let method of paymentMethods"
      [value]="method.value"
      class="parent-option"
      [disabled]="!method.isActive"
    >
      {{ method.label }}
    </mat-radio-button>

  </mat-radio-group>

  <!-- RHS: Child options + inputs -->
  <div class="payment-body" *ngIf="selectedMethod">
    <div class="child-options" *ngIf="selectedMethod.childOptions?.length">
      <mat-radio-group formControlName="selectedChildOption">
        <mat-radio-button
          *ngFor="let option of selectedMethod.childOptions"
          [value]="option.value"
          class="child-option"
        >
          {{ option.label }}
        </mat-radio-button>
      </mat-radio-group>
    </div>

    <!-- 🔹 Card form -->
    <div *ngIf="paymentForm.value.paymentMethod === 'card' && paymentForm.value.selectedChildOption">
      <div class="card-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Card Holder Name</mat-label>
          <input matInput formControlName="cardHolderName" placeholder="John Doe" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width card-input">
          <mat-label>Card Number</mat-label>
          <input
            matInput
            formControlName="cardNumber"
            placeholder="1234 5678 9012 3456"
            (input)="detectCardType(paymentForm.get('cardNumber')?.value)"
          />
          <img *ngIf="cardType" [src]="'/cardlogo/' + cardType + '.png'" class="card-icon" />
        </mat-form-field>

        <div class="expiry-cvv">
          <mat-form-field appearance="outline">
            <mat-label>Expiry Month</mat-label>
            <mat-select formControlName="expiryMonth">
              <mat-option *ngFor="let month of months" [value]="month">{{ month }}</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Expiry Year</mat-label>
            <mat-select formControlName="expiryYear">
              <mat-option *ngFor="let year of years" [value]="year">{{ year }}</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>CVV</mat-label>
            <input matInput formControlName="cvv" placeholder="123" />
          </mat-form-field>
        </div>
      </div>
      <app-billing-address [billingForm]=billingGroup></app-billing-address>
    </div>

    <!-- 🔹 UPI form -->
    <div *ngIf="paymentForm.value.paymentMethod === 'upi' && paymentForm.value.selectedChildOption">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>UPI ID</mat-label>
        <input matInput formControlName="upiId" placeholder="example@upi" />
        <mat-error *ngIf="paymentForm.get('upiId')?.hasError('required')">
          UPI ID is required
        </mat-error>
        <mat-error *ngIf="paymentForm.get('upiId')?.hasError('pattern')">
          Enter a valid UPI ID
        </mat-error>
      </mat-form-field>
    </div>

    <!-- 🔹 QR form -->
    <div *ngIf="paymentForm.value.paymentMethod === 'qr' && paymentForm.value.selectedChildOption">
      <div class="qr-container">
        <button mat-raised-button color="primary" (click)="generateQR()">Generate QR</button>
        <div *ngIf="qrData">
          <qrcode [qrdata]="qrData" [width]="200" errorCorrectionLevel="M"></qrcode>
          <p>Scan to pay: {{ qrData }}</p>
        </div>
      </div>
    </div>
  </div>
</div>



      <button mat-raised-button color="primary" type="submit" [disabled]="paymentForm.invalid">
        Pay Now
      </button>
    </form>
  </mat-card>
</div>
