
<div class="container">
  <mat-card class="payment-wrapper">
    <h2 mat-card-title>Payment Gateway</h2>
    <div class="accepted-cards">
      <p>We accept:</p>
      <div class="card-logos">
        <img src="/cardlogo/visa.png" alt="VISA" />
        <img src="/cardlogo/mastercard.png" alt="Mastercard" />
        <img src="/cardlogo/amex.png" alt="American Express" />
        <img src="/cardlogo/rupay.png" alt="rupay-card" />
      </div>
    </div>

    <form [formGroup]="paymentForm" (ngSubmit)="onSubmit()">

  <mat-radio-group formControlName="paymentMethod" class="payment-option-group">
  <ng-container *ngFor="let method of paymentMethods">
    <mat-radio-button *ngIf="method.isActive" [value]="method.value" class="payment-option payment-methods">
      {{ method.label }}
    </mat-radio-button>

    <!-- Show child options dynamically -->
    <div
      *ngIf="paymentForm.get('paymentMethod')?.value === method.value && method.childOptions"
      class="child-options"
    >
      <mat-radio-group formControlName="selectedChildOption">
        <ng-container *ngFor="let option of method.childOptions">
            <mat-radio-button [value]="option.value" class="child-option">
              {{ option.label }}
            </mat-radio-button>
        </ng-container>
      </mat-radio-group>
      

      <!-- ✅ Card details shown only when current method is 'card' -->
      <!--  -->
      <ng-container *ngIf="paymentForm.get('paymentMethod')?.value === method.value && method.value === 'card'">
        <div class="card-details">
          <div class="card-details-head">Card Details</div>
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Card Holder Name</mat-label>
            <input matInput type="text" formControlName="cardHolderName" placeholder="Aashutosh Kumar" />
          </mat-form-field>

        <mat-form-field appearance="outline" class="full-width card-input-wrapper">
          <mat-label>Card Number</mat-label>
          <input matInput type="text" formControlName="cardNumber" placeholder="1234 5678 9123 4567"
            (input)="detectCardType(paymentForm.get('cardNumber')?.value)" />
          <ng-container *ngIf="cardType">
            <img [src]="'/cardlogo/' + cardType + '.png'" [alt]="cardType" class="card-icon" />
          </ng-container>
        </mat-form-field>

        <div class="expiry-cvv-row">
          <mat-form-field appearance="outline">
            <mat-label>Month</mat-label>
            <mat-select formControlName="expiryMonth">
              <mat-option *ngFor="let month of months" [value]="month">{{ month }}</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Year</mat-label>
            <mat-select formControlName="expiryYear">
              <mat-option *ngFor="let year of years" [value]="year">{{ year }}</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>CVV</mat-label>
            <input matInput type="text" formControlName="cvv" placeholder="123" />
          </mat-form-field>
        </div>
        <mat-divider></mat-divider>
        <div class="billing-address">
          <app-billing-address [billingForm]="billingGroup"></app-billing-address>
        </div>
      </div>
      </ng-container>


    <!-- ✅ UPI input (only for UPI method) -->
    <div *ngIf="paymentForm.get('paymentMethod')?.value === method.value && method.value === 'upi'">
      <mat-form-field appearance="outline" class="full-width upi-container">
        <mat-label>UPI ID</mat-label>
        <input matInput type="text" formControlName="upiId" placeholder="example@upi" />
          <mat-error *ngIf="paymentForm.get('upiId')?.hasError('required')">
            UPI ID is required
          </mat-error>
          <mat-error *ngIf="paymentForm.get('upiId')?.hasError('pattern')">
            Please enter a valid UPI ID (e.g. yourname@upi)
          </mat-error>
      </mat-form-field>
    </div>

    <!-- ✅ QR Section (only for QR method) -->
    <div *ngIf="paymentForm.get('paymentMethod')?.value === method.value && method.value === 'qr'">
      <div class="qr-section">
        <button mat-raised-button color="primary" (click)="generateQR()">Generate QR</button>
        <div *ngIf="qrData" class="qr-container">
          <qrcode [qrdata]="qrData" [width]="200" errorCorrectionLevel="M"></qrcode>
          <p><strong>Scan to pay:</strong> {{ qrData }}</p>
        </div>
        <mat-progress-bar *ngIf="qrInProgress" mode="indeterminate"></mat-progress-bar>
        <p *ngIf="qrSuccess" class="success-msg">✅ Payment Successful via QR!</p>
      </div>
    </div>
    </div>
  </ng-container>
  
</mat-radio-group>


      <button mat-raised-button color="primary" type="submit" [disabled]="paymentForm.invalid">
        Pay Now
      </button>
    </form>
  </mat-card>
</div>
