
<mat-card class="container">
  <h2>List of Students</h2>
  <mat-table [dataSource]="dataSource" mat-table class="mat-elevation-z8">

    <ng-container matColumnDef="firstName">
      <mat-header-cell *matHeaderCellDef>First Name</mat-header-cell>
      <mat-cell *matCellDef="let students">{{students.firstName}}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="lastName">
      <mat-header-cell *matHeaderCellDef>Last Name</mat-header-cell>
      <mat-cell *matCellDef="let students">{{students.lastName}}</mat-cell>

    </ng-container>
    <ng-container matColumnDef="age">
      <mat-header-cell *matHeaderCellDef>Age</mat-header-cell>
      <mat-cell *matCellDef="let students">{{students.age}}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="rollNum">
      <mat-header-cell *matHeaderCellDef>Roll Number</mat-header-cell>
      <mat-cell *matCellDef="let students">{{students.rollNum}}</mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayColumns"></mat-row>
  </mat-table>
</mat-card>
