<mat-card>
  <mat-card-title>Generate Payment QR</mat-card-title>
  <mat-card-content>
    <form [formGroup]="paymentForm" (ngSubmit)="generateQR()">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Customer Name</mat-label>
        <input matInput formControlName="customerName" required>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Amount</mat-label>
        <input matInput type="number" formControlName="amount" required>
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit">
        Generate QR
      </button>
    </form>

    <div *ngIf="showQR" class="qr-container">
      <qrcode [qrdata]="qrData" [width]="200" errorCorrectionLevel="M"></qrcode>
      <p><strong>QR Content:</strong> {{ qrData }}</p>
    </div>
  </mat-card-content>
</mat-card>
