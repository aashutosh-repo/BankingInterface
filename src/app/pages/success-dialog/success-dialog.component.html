<div class="dialog-container">
  <!-- ✅ Animated Green Tick -->
  <div class="tick-container">
    <mat-icon class="success-icon">check_circle</mat-icon>
  </div>

  <!-- ✅ Success Message -->
  <h2 class="success-title">Success!</h2>
  <p class="success-message">Your action was successfully completed.</p>

  <!-- ✅ Close Button -->
  <button mat-raised-button color="primary" (click)="closeDialog()" class="close-button">
    OK
  </button>
</div>
