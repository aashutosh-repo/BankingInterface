<div class="container h-100">
	<div class="d-flex justify-content-center h-100">
	  <div class="user_card">
		<div class="d-flex justify-content-center">
		  <div class="brand_logo_container">
			<img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh3-UtWQRqzG5s1R4IFN0QXck5hXvNqsGebllIAqXNeXRFVpx6OESz1fsV7a26OBJv64k0_2tjkTLOZTpTIbHM8HJyJTwoFkeFHHEaE7Kk8b3HySLsDntiKQGaby38ljp5Sicp0molZJtIpQ41vrbZw9kHu7Doq2tU2I0Umk42RjJO0jc9uH35ULBXzsRWT/s320/BankLogo.jpg" class="brand_logo" alt="Logo">
		  </div>
		</div>
		<div class="d-flex justify-content-center form_container">
		  <form (ngSubmit)="verifyUser()" >
			<div class="input-group mb-3">
			  <div class="input-group-append">
				<span class="input-group-text"><i class="fas fa-user"></i></span>
			  </div>
			  <input type="text" [(ngModel)] ="user.username" name="username" class="form-control input_user" ngModel placeholder="username" required>
			</div>
			<div class="input-group mb-2">
			  <div class="input-group-append">
				<span class="input-group-text"><i class="fas fa-key"></i></span>
			  </div>
			  <input type="password" [(ngModel)] ="user.password" name="password" class="form-control input_pass" ngModel placeholder="password" required>
			</div>
			<div class="form-group">
			  <div class="custom-control custom-checkbox">
				<input type="checkbox" class="custom-control-input" id="customControlInline">
				<label class="custom-control-label" for="customControlInline">Remember me</label>
			  </div>
			</div>
			<div class="d-flex justify-content-center mt-3 login_container">
			  <button type="submit" class="btn login_btn">Login</button>
			</div>
		  </form>
		</div>
  
		<div class="mt-4">
		  <div class="d-flex justify-content-center links">
			Don't have an account? <a href="#" class="ml-2">Sign Up</a>
		  </div>
		  <div class="d-flex justify-content-center links">
			<a href="#">Forgot your password?</a>
		  </div>
		</div>
	  </div>
	</div>
  </div>
