<div class="homepage-container">
    <mat-toolbar color="primary" class="header">
      <img src="lufthansa-logo.png" alt="Lufthansa Logo" class="logo">
      <span class="spacer"></span>
      <button mat-button>Book</button>
      <button mat-button>Check-in</button>
      <button mat-button>My Bookings</button>
      <button mat-button>Help</button>
    </mat-toolbar>
  
    <div class="hero-section">
      <div class="search-container mat-elevation-z4">
        <form [formGroup]="searchForm" (ngSubmit)="onSearch()">
          <mat-card>
            <mat-card-content>
              <div class="search-grid">
                <mat-form-field appearance="outline">
                  <mat-label>From</mat-label>
                  <input matInput formControlName="origin" [matAutocomplete]="originAuto">
                  <mat-autocomplete #originAuto="matAutocomplete">
                    <mat-option *ngFor="let dest of destinations" [value]="dest.code">
                      {{dest.name}}
                    </mat-option>
                  </mat-autocomplete>
                </mat-form-field>
  
                <mat-form-field appearance="outline">
                  <mat-label>To</mat-label>
                  <input matInput formControlName="destination" [matAutocomplete]="destAuto">
                  <mat-autocomplete #destAuto="matAutocomplete">
                    <mat-option *ngFor="let dest of destinations" [value]="dest.code">
                      {{dest.name}}
                    </mat-option>
                  </mat-autocomplete>
                </mat-form-field>
  
                <mat-form-field appearance="outline">
                  <mat-label>Departure</mat-label>
                  <input matInput [matDatepicker]="departurePicker" formControlName="departureDate">
                  <mat-datepicker-toggle matSuffix [for]="departurePicker"></mat-datepicker-toggle>
                  <mat-datepicker #departurePicker></mat-datepicker>
                </mat-form-field>
  
                <mat-form-field appearance="outline">
                  <mat-label>Return</mat-label>
                  <input matInput [matDatepicker]="returnPicker" formControlName="returnDate">
                  <mat-datepicker-toggle matSuffix [for]="returnPicker"></mat-datepicker-toggle>
                  <mat-datepicker #returnPicker></mat-datepicker>
                </mat-form-field>
  
                <mat-form-field appearance="outline">
                  <mat-label>Passengers</mat-label>
                  <input matInput type="number" formControlName="passengers" min="1">
                </mat-form-field>
  
                <button mat-raised-button color="primary" type="submit" [disabled]="!searchForm.valid">
                  Search Flights
                </button>
              </div>
            </mat-card-content>
          </mat-card>
        </form>
      </div>
    </div>
  
    <div class="featured-section">
      <h2>Featured Destinations</h2>
      <div class="destination-grid">
        <mat-card *ngFor="let destination of destinations.slice(0, 4)" class="destination-card">
          <img mat-card-image [src]="destination.imageUrl" [alt]="destination.name">
          <mat-card-content>
            <h3>{{destination.name}}</h3>
            <p>From {{destination.price}}</p>
          </mat-card-content>
          <mat-card-actions>
            <button mat-button color="primary">Book Now</button>
          </mat-card-actions>
        </mat-card>
      </div>
    </div>
  </div>
