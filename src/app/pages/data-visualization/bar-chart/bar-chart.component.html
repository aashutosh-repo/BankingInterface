<div class="p-4 controls max-w-5xl mx-auto">
  <!-- Filter Controls -->
  <div class="mb-4 flex flex-wrap items-center gap-4 justify-start">
    <button
      class="button"
      [class.active]="selectedView === 'type-vs-amount'"
      (click)="setView('type-vs-amount')">
      All Types vs Amount
    </button>

    <button
      class="button"
      [class.active]="selectedView === 'type-vs-year'"
      (click)="setView('type-vs-year')">
      Type vs Year
    </button>

    <select
      *ngIf="selectedView === 'type-vs-year'"
      [(ngModel)]="selectedTxnType"
      (change)="updateChart()"
      class="button">
      <option *ngFor="let type of txnTypes" [value]="type">{{ type }}</option>
    </select>
  </div>

  <!-- Chart Container -->
  <div class="chart-container">
    <canvas
      *ngIf="isBrowser"
      baseChart
      [data]="barChartData"
      [options]="barChartOptions"
      [type]="'bar'"
      [plugins]="[DataLabelsPlugin]">
    </canvas>
  </div>
</div>
