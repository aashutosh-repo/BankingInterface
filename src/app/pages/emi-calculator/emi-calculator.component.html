<div class="container mt-5">
    <div class="card emi-card">
      <div class="card-header text-center bg-primary text-white">
        <h3>EMI Calculator</h3>
      </div>
      <div class="card-body">
        <form (ngSubmit)="calculateEMI()">
          <div class="mb-3">
            <label for="loanAmount" class="form-label">Loan Amount (₹)</label>
            <input type="number" [(ngModel)]="loanAmount" name="loanAmount" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="interestRate" class="form-label">Annual Interest Rate (%)</label>
            <input type="number" [(ngModel)]="interestRate" name="interestRate" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="loanTenure" class="form-label">Loan Tenure (Years)</label>
            <input type="number" [(ngModel)]="loanTenure" name="loanTenure" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-success w-100">Calculate EMI</button>
        </form>
  
        <div *ngIf="emiResult !== null" class="mt-4 result-container">
          <h4 class="text-center">EMI Amount: ₹ {{ emiResult | number:'1.2-2' }}</h4>
        </div>
      </div>
    </div>
  </div>
