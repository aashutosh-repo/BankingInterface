<div class="dashboard-container mat-app-background p-4 max-w-7xl mx-auto">

  <!-- <app-filter-panel (filtersChanged)="onFiltersChanged($event)" class="mb-6"></app-filter-panel> -->

  <!-- <app-summary-cards class="mb-6"></app-summary-cards> -->

  <mat-tab-group [(selectedIndex)]="selectedIndex" (selectedIndexChange)="onTabChange($event)" class="mb-4">

    <mat-tab label="EMI Calculator"></mat-tab>
    <mat-tab label="Currency Converter"></mat-tab>
    <mat-tab label="SIP Calculator"></mat-tab>
    <mat-tab label="Holiday Calender"></mat-tab>

  </mat-tab-group>

  <div class="chart-area">
    <app-emi-calculator *ngIf="selectedIndex === 0"></app-emi-calculator>
    <app-currency-convertor *ngIf="selectedIndex === 1"></app-currency-convertor>
    <app-sip-calculator *ngIf="selectedIndex === 2"></app-sip-calculator>
    <app-holidays-calender *ngIf="selectedIndex === 3"></app-holidays-calender>
  </div>
</div>
