<div class="container">
  <h2 class="mb-4 text-center nominee-header">
    <mat-icon class="header-icon">person</mat-icon> Nominee Details
  </h2>  
  <form (ngSubmit)="moveToPreview()" #nomineeForm="ngForm">
    <mat-grid-list cols="2" rowHeight="90px" gutterSize="16px">
      
      <!-- Owner ID -->
      <mat-grid-tile>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Owner ID</mat-label>
          <input matInput type="number" [(ngModel)]="nomineeDetail.ownerId" name="ownerId" required />
        </mat-form-field>
      </mat-grid-tile>

      <!-- Nominee Reference Number -->
      <!-- <mat-grid-tile>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nominee Reference Number</mat-label>
          <input matInput type="number" [(ngModel)]="nomineeDetail.nomineeRefNum" name="nomineeRefNum" />
        </mat-form-field>
      </mat-grid-tile> -->

      <!-- Owner Type -->
      <mat-grid-tile>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Owner Type</mat-label>
          <input matInput type="number" [(ngModel)]="nomineeDetail.ownerType" name="ownerType" />
        </mat-form-field>
      </mat-grid-tile>

      <!-- Sequence Number -->
      <!-- <mat-grid-tile>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Sequence Number</mat-label>
          <input matInput type="number" [(ngModel)]="nomineeDetail.seqNum" name="seqNum" />
        </mat-form-field>
      </mat-grid-tile> -->

      <!-- Nominee Share -->
      <mat-grid-tile>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nominee Share (%)</mat-label>
          <input matInput type="number" [(ngModel)]="nomineeDetail.nomShare" name="nomShare" />
        </mat-form-field>
      </mat-grid-tile>

      <!-- Nominee Type -->
      <mat-grid-tile>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nominee Type</mat-label>
          <mat-select [(ngModel)]="nomineeDetail.nomType" name="nomType">
            <mat-option *ngFor="let type of nomineeTypes" [value]="type">
              {{ type }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </mat-grid-tile>
      
      

      <!-- Nominee First Name -->
      <mat-grid-tile>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>First Name</mat-label>
          <input matInput type="text" [(ngModel)]="nomineeDetail.nomineeFirstName" name="nomineeFirstName" />
        </mat-form-field>
      </mat-grid-tile>

      <!-- Nominee Last Name -->
      <mat-grid-tile>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Last Name</mat-label>
          <input matInput type="text" [(ngModel)]="nomineeDetail.nomineeLastName" name="nomineeLastName" />
        </mat-form-field>
      </mat-grid-tile>

      <!-- Relationship Type -->
      <mat-grid-tile>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Relationship Type</mat-label>
          <mat-select [(ngModel)]="nomineeDetail.nomType" name="nomType">
            <mat-option *ngFor="let type of nomineeRelaions" [value]="type">
              {{ type }}
            </mat-option>
          </mat-select>        </mat-form-field>
      </mat-grid-tile>

      <!-- Date of Birth -->
      <mat-grid-tile>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Date of Birth</mat-label>
          <input matInput [matDatepicker]="dobPicker" [(ngModel)]="nomineeDetail.dateOfBirth" name="dateOfBirth" />
          <mat-datepicker-toggle matSuffix [for]="dobPicker"></mat-datepicker-toggle>
          <mat-datepicker #dobPicker></mat-datepicker>
        </mat-form-field>
      </mat-grid-tile>

      <!-- Nominee Address ID -->
      <mat-grid-tile>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nominee Address ID</mat-label>
          <input matInput type="number" [(ngModel)]="nomineeDetail.nomAddId" name="nomAddId" />
        </mat-form-field>
      </mat-grid-tile>

      <!-- Nominee Document ID -->
      <mat-grid-tile>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nominee Document ID</mat-label>
          <input matInput type="text" [(ngModel)]="nomineeDetail.nomDocId" name="nomDocId" />
        </mat-form-field>
      </mat-grid-tile>

    </mat-grid-list>

    <!-- Submit Button -->
    <div class="text-center mt-4">
      <button mat-raised-button color="primary" type="submit">Submit</button>
    </div>
  </form>
</div>
