<div class="container">
  <h2 class="mb-4 text-center nominee-header">
    <mat-icon class="header-icon">description</mat-icon> Document Details
  </h2>

  <form [formGroup]="documentForm" (ngSubmit)="onSubmit()">
    <mat-grid-list cols="2" rowHeight="90px" gutterSize="16px">

      <!-- Customer ID -->
      <mat-grid-tile>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Customer ID</mat-label>
          <input matInput type="number" formControlName="custId" />
        </mat-form-field>
      </mat-grid-tile>

      <!-- Document Description -->
      <mat-grid-tile>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Document Description</mat-label>
          <input matInput type="text" formControlName="docDescription" />
        </mat-form-field>
      </mat-grid-tile>

      <!-- Identification Number -->
      <mat-grid-tile>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Identification Number</mat-label>
          <input matInput type="text" formControlName="docIdentificationNumber" />
        </mat-form-field>
      </mat-grid-tile>

      <!-- Document Type -->
      <mat-grid-tile>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Document Type</mat-label>
          <mat-select formControlName="docType">
            @for (type of documentType; track type) {
              <mat-option [value]="type">
                {{ type }}
              </mat-option>
            }
          </mat-select>
        </mat-form-field>
      </mat-grid-tile>

      <!-- Issue Date -->
      <mat-grid-tile>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Issue Date</mat-label>
          <input matInput [matDatepicker]="issuePicker" formControlName="issueDate" />
          <mat-datepicker-toggle matSuffix [for]="issuePicker"></mat-datepicker-toggle>
          <mat-datepicker #issuePicker></mat-datepicker>
        </mat-form-field>
      </mat-grid-tile>

      <!-- Expiry Date -->
      <mat-grid-tile>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Expiry Date</mat-label>
          <input matInput [matDatepicker]="expiryPicker" formControlName="expiryDate" />
          <mat-datepicker-toggle matSuffix [for]="expiryPicker"></mat-datepicker-toggle>
          <mat-datepicker #expiryPicker></mat-datepicker>
        </mat-form-field>
      </mat-grid-tile>

    </mat-grid-list>

    <div class="text-center mt-4">
      <button mat-raised-button color="primary" type="submit">Submit</button>
    </div>
  </form>
</div>
