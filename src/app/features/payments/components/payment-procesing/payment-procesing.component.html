<div class="payment-container" [formGroup]="form">
  <!-- LHS -->
  <div class="payment-options">
    <button 
      *ngFor="let method of paymentMethods"
      [disabled]="!method.isActive"
      [class.active]="selectedMethod === method.value"
      (click)="selectMethod(method)">
      {{ method.label }}
    </button>
  </div>

  <!-- RHS -->
  <div class="payment-body" *ngIf="selectedMethod as sm">
    <ng-container *ngFor="let method of paymentMethods">
      <div *ngIf="sm === method.value">
        
        <!-- Child Options -->
        <div *ngIf="method.childOptions?.length" class="child-options">
          <h4>{{ method.label }} Options</h4>
          <div class="child-list">
            <button 
              *ngFor="let child of method.childOptions"
              [class.active]="selectedChild === child.value"
              (click)="selectChild(child.value)">
              {{ child.label }}
            </button>
          </div>
        </div>

        <!-- Forms -->
        <div class="payment-form" *ngIf="!method.childOptions || selectedChild">
          
          <!-- Credit Card -->
          <ng-container *ngIf="method.value === 'card'">
            <div *ngIf="selectedChild === 'full'">
              <h3>Credit Card - Full Payment</h3>
              <input formControlName="cardNumber" placeholder="Card Number" />
              <div *ngIf="paymentForm.get('cardNumber')?.touched && paymentForm.get('cardNumber')?.invalid">
                Must be 16 digits
              </div>
              <input formControlName="expiry" placeholder="MM/YY" />
              <input formControlName="cvv" placeholder="CVV" type="password" />
              <button (click)="submitPayment()">Pay Now</button>
            </div>

            <div *ngIf="selectedChild === 'emi'">
              <h3>Credit Card - EMI</h3>
              <select formControlName="emiTenure">
                <option value="">Select Tenure</option>
                <option value="3">3 Months</option>
                <option value="6">6 Months</option>
                <option value="12">12 Months</option>
              </select>
              <button (click)="submitPayment()">Proceed</button>
            </div>
          </ng-container>

          <!-- UPI -->
          <ng-container *ngIf="method.value === 'upi'">
            <div *ngIf="selectedChild === 'normal'">
              <h3>UPI Payment</h3>
              <input formControlName="upiId" placeholder="Enter UPI ID" />
              <button (click)="submitPayment()">Pay</button>
            </div>

            <div *ngIf="selectedChild === 'emi'">
              <h3>UPI EMI</h3>
              <select formControlName="emiTenure">
                <option value="3">3 Months</option>
                <option value="6">6 Months</option>
              </select>
              <button (click)="submitPayment()">Proceed</button>
            </div>

            <div *ngIf="selectedChild === 'advance'">
              <h3>UPI Advance Payment</h3>
              <input formControlName="advanceAmount" type="number" placeholder="Advance Amount" />
              <button (click)="submitPayment()">Pay</button>
            </div>
          </ng-container>

          <!-- QR -->
          <ng-container *ngIf="method.value === 'qr'">
            <h3>Scan QR Code</h3>
            <img src="assets/qr-placeholder.png" alt="QR Code" />
          </ng-container>

          <!-- Net Banking -->
          <ng-container *ngIf="method.value === 'netbanking'">
            <h3>Net Banking</h3>
            <select formControlName="bank">
              <option value="SBI">SBI</option>
              <option value="HDFC">HDFC</option>
              <option value="ICICI">ICICI</option>
            </select>
            <button (click)="submitPayment()">Proceed</button>
          </ng-container>

          <!-- COD -->
          <ng-container *ngIf="method.value === 'cod'">
            <h3>Pay on Delivery</h3>
            <p>You will pay at the time of delivery.</p>
            <button (click)="submitPayment()">Confirm</button>
          </ng-container>
        </div>
      </div>
    </ng-container>
  </div>
</div>
